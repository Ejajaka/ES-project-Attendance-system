; PlatformIO Project Configuration File
; Shusseki ESP32 room TRANSMITTER (Soshin role).

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200

; 4 MB flash, single 3 MB app partition (see sdkconfig.defaults for the BT/WiFi flags).
board_build.partitions = partitions.csv

; Injects the build epoch as -DDEV_SEED_EPOCH=<unix> (clock fallback when NTP is unavailable).
extra_scripts = pre:scripts/epoch.py
