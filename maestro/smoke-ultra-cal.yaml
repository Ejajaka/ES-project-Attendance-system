appId: com.shusseki.app
---
# Sweep ultrasonic baseFreq 18.5kHz -> 100Hz at max amplitude. Waits for the
# calibration run to finish, then confirms it reported a PASS or FAIL outcome.
- openLink: "shusseki://smoke?run=ultra-cal"
- extendedWaitUntil:
    visible: "ultra-cal: (PASS|FAIL)"
    timeout: 180000
- assertVisible: "ultra-cal: (PASS|FAIL)"