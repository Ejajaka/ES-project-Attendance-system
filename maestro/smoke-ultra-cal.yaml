appId: com.shusseki.app
---
# Ultrasonic presence-stamp self-test (transmit + record on one device).
# Waits for the run to finish; a PASS or FAIL is both a valid result (AGC/speaker
# coupling makes single-device loopback marginal — real presence is cross-device).
- openLink: "shusseki://smoke?run=ultra-presence"
- extendedWaitUntil:
    visible: "ultra-presence: (PASS|FAIL)"
    timeout: 40000
- assertVisible: "ultra-presence: (PASS|FAIL)"